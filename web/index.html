<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ajar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='11' fill='%2314201f'/%3E%3Cg stroke='%2345605c' stroke-width='2.6'%3E%3Cline x1='24' y1='24' x2='13' y2='13'/%3E%3Cline x1='24' y1='24' x2='35' y2='14'/%3E%3Cline x1='24' y1='24' x2='13' y2='35'/%3E%3Cline x1='24' y1='24' x2='35' y2='35'/%3E%3C/g%3E%3Ccircle cx='13' cy='13' r='4' fill='%23e4ece8'/%3E%3Ccircle cx='35' cy='14' r='4' fill='%23e4ece8'/%3E%3Ccircle cx='13' cy='35' r='4' fill='%23e4ece8'/%3E%3Ccircle cx='35' cy='35' r='4.6' fill='%23e8923a'/%3E%3Ccircle cx='24' cy='24' r='6' fill='%23e4ece8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="hero">
  <div class="brand">
    <svg class="logo" viewBox="0 0 48 48" width="40" height="40" role="img" aria-label="Ajar">
      <line x1="24" y1="24" x2="13" y2="13"/><line x1="24" y1="24" x2="35" y2="14"/>
      <line x1="24" y1="24" x2="13" y2="35"/><line x1="24" y1="24" x2="35" y2="35"/>
      <circle cx="13" cy="13" r="3.4" class="nd"/><circle cx="35" cy="14" r="3.4" class="nd"/>
      <circle cx="13" cy="35" r="3.4" class="nd"/><circle cx="35" cy="35" r="4" class="acc"/>
      <circle cx="24" cy="24" r="5.4" class="nd"/>
    </svg>
    <div class="brandtext">
      <h1>Ajar</h1>
      <p class="sub" id="sub">Loading…</p>
    </div>
  </div>
  <div id="netbar" class="netbar"></div>
  <div class="btns">
    <button id="scan" title="Find devices on your network. Fast.">Map Network</button>
    <button id="audit" class="quiet" title="Scan ports and check services, CVEs, and logins. Reuses recent deep scans to be fast.">Standard Scan</button>
    <button id="fullAudit" class="quiet" title="Force a fresh, deep scan of every port on every device. Takes longer.">Deep Scan</button>
    <button id="stopScan" class="quiet" style="display:none; border-color:var(--high); color:var(--high)">Stop</button>
  </div>
</header>
<section id="progress" aria-live="polite" hidden></section>
<div id="banner"></div>
<section id="inet" hidden></section>
<section id="scorecard" hidden></section>
<nav class="tabs" role="tablist">
  <button role="tab" data-tab="devices" aria-selected="true">Devices</button>
  <button role="tab" data-tab="wifi" aria-selected="false">WiFi <span id="wifiBadge"></span></button>
  <button role="tab" data-tab="security" aria-selected="false">Security</button>
  <button role="tab" data-tab="changes" aria-selected="false">Changes <span id="changesBadge"></span></button>
  <button role="tab" data-tab="settings" aria-selected="false">Settings</button>
</nav>
<section id="devices">
  <div class="summary">
    <span id="count"></span>
    <button class="quiet" id="approveAll" hidden>Approve all</button>
  </div>
  <svg id="map" viewBox="0 0 360 382" role="img" aria-label="Map of devices on your network"></svg>
  <ul id="list"></ul>
</section>
<section id="wifi" hidden>
  <div class="sechead">
    <span class="sub" id="wifiSub">Loading…</span>
  </div>
  <div id="wifiBanner"></div>
  <p class="conn" id="conn"></p>
  <div id="wifiHint"></div>
  <div id="bands"></div>
  <h3 class="nets">Networks nearby</h3>
  <ul id="nets"></ul>
</section>
<section id="security" hidden></section>
<section id="settings" hidden></section>
<section id="changes" hidden>
  <div class="sechead">
    <span class="sub" id="changesSub">What changed on this network, newest first.</span>
    <label class="toggle"><input type="checkbox" id="presence"> Show devices coming and going</label>
  </div>
  <div id="timeline"></div>
</section>

<script src="app.js"></script>
<footer id="footer"></footer>
</body>
</html>
